[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "gamesave2minecraft"
version = "0.1.0"
description = "Research reference implementation of source-bound game-save migration into Minecraft"
requires-python = ">=3.10"
authors = [{name = "Alex Chengyu Li"}]
license = {text = "MIT"}

[project.scripts]
gamesave2minecraft = "gamesave2minecraft.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
